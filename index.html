<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Markets">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Markets</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3Crect width='1' height='1'/%3E%3C/svg%3E">
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
:root{--bg:#000;--panel:#0a0a0a;--line:#1f1f1f;--tx:#f2f2f2;--mut:#8a8a8a;--ac:#fff}
:root[data-theme=light]{--bg:#fff;--panel:#f5f5f5;--line:#e2e2e2;--tx:#0a0a0a;--mut:#6b6b6b;--ac:#000}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;letter-spacing:.04em}
.btns{display:flex;gap:8px}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--line)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
aside{width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px}
.item small{display:block;color:var(--mut);margin-top:2px;font-size:12px}
.item.on{background:var(--line);box-shadow:inset 3px 0 var(--ac);font-weight:600}
#chartwrap{flex:1;min-width:0;position:relative;background:var(--bg);touch-action:none}
#tv,#tv iframe{position:absolute;inset:0;touch-action:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:8px;z-index:9;max-width:90vw;text-align:center}
@media(max-width:700px){
  main{flex-direction:column}
  aside{width:100%;display:flex;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);flex:none;touch-action:pan-x}
  .item{width:auto;flex:none;white-space:nowrap;border-bottom:0;border-right:1px solid var(--line);padding:10px 14px}
  .item small{display:none}
  .item.on{box-shadow:inset 0 -3px var(--ac)}
}
</style>
</head>
<body>
<header>
  <span class="logo">MARKETS</span>
  <div class="btns">
    <button id="install" hidden>Install app</button>
    <button id="theme">Light</button>
  </div>
</header>
<main>
  <aside id="list"></aside>
  <div id="chartwrap"><div id="tv"></div></div>
</main>
<div id="toast" hidden></div>
<script>
const PAIRS=[
  {n:'Nasdaq 100',d:'US100',s:'OANDA:NAS100USD'},
  {n:'Dow Jones',d:'US30',s:'OANDA:US30USD'},
  {n:'XAUUSD',d:'Gold',s:'OANDA:XAUUSD'},
  {n:'EURUSD',d:'Euro / Dollar',s:'OANDA:EURUSD'},
  {n:'GBPUSD',d:'Pound / Dollar',s:'OANDA:GBPUSD'},
  {n:'AUDUSD',d:'Aussie / Dollar',s:'OANDA:AUDUSD'},
  {n:'USDJPY',d:'Dollar / Yen',s:'OANDA:USDJPY'}
];
const $=id=>document.getElementById(id);
let cur=PAIRS[2].s,theme='dark';
try{
  const v=localStorage.getItem('sym');if(PAIRS.some(p=>p.s===v))cur=v;
  const t=localStorage.getItem('theme');if(t==='light'||t==='dark')theme=t;
}catch{}
const save=()=>{try{localStorage.setItem('sym',cur);localStorage.setItem('theme',theme)}catch{}};

function list(){
  $('list').innerHTML=PAIRS.map(p=>`<button class="item ${p.s===cur?'on':''}" data-s="${p.s}">${p.n}<small>${p.d}</small></button>`).join('');
}
function mount(){
  $('tv').innerHTML='';
  const dark=theme==='dark';
  new TradingView.widget({
    autosize:true,symbol:cur,interval:'60',timezone:'Etc/UTC',theme:theme,style:'1',locale:'en',
    enable_publishing:false,allow_symbol_change:false,withdateranges:true,save_image:true,
    toolbar_bg:dark?'#000000':'#ffffff',container_id:'tv',
    loading_screen:{backgroundColor:dark?'#000000':'#ffffff'},
    overrides:dark?{
      'paneProperties.background':'#000000','paneProperties.backgroundType':'solid',
      'paneProperties.vertGridProperties.color':'#141414','paneProperties.horzGridProperties.color':'#141414',
      'scalesProperties.lineColor':'#1f1f1f'
    }:{
      'paneProperties.background':'#ffffff','paneProperties.backgroundType':'solid'
    }
  });
}
function apply(){
  document.documentElement.dataset.theme=theme;
  document.querySelector('meta[name=theme-color]').content=dark=theme==='dark'?'#000000':'#ffffff';
  $('theme').textContent=theme==='dark'?'Light':'Dark';
  list();save();
}
$('list').onclick=e=>{const b=e.target.closest('.item');if(b){cur=b.dataset.s;apply();mount()}};
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';apply();mount()};
apply();mount();

/* PWA */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let dp;const ib=$('install');
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,4000)}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;ib.hidden=false});
addEventListener('appinstalled',()=>{ib.hidden=true;dp=null});
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent))ib.hidden=false;
ib.onclick=async()=>{
  if(dp){dp.prompt();await dp.userChoice;dp=null;ib.hidden=true}
  else toast('Tap Share, then "Add to Home Screen"');
};

/* Solid black iOS icon */
(function(){
  const c=document.createElement('canvas');c.width=c.height=180;
  const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,180,180);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.append(l);
})();
</script>
</body>
</html>
