<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131722">
<title>Markets</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
:root{--bg:#131722;--panel:#1b2030;--line:#2a3042;--tx:#d1d4dc;--mut:#787b86;--ac:#2962ff}
:root[data-theme=light]{--bg:#fff;--panel:#f4f5f8;--line:#e0e3eb;--tx:#131722;--mut:#6a6d78}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-size:15px}
button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{background:var(--line)}
button:focus-visible{outline:2px solid var(--ac)}
main{flex:1;display:flex;min-height:0}
aside{width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 12px}
.item small{display:block;color:var(--mut);margin-top:2px}
.item.on{background:var(--line);box-shadow:inset 3px 0 var(--ac)}
#chartwrap{flex:1;min-width:0;position:relative}
#tv{position:absolute;inset:0}
@media(max-width:700px){
  main{flex-direction:column}
  aside{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .item{width:auto;white-space:nowrap;border-bottom:0;border-right:1px solid var(--line)}
  .item small{display:none}
  .item.on{box-shadow:inset 0 -3px var(--ac)}
}
</style>
</head>
<body>
<header><b>Markets</b><button id="theme">Light / Dark</button></header>
<main>
  <aside id="list"></aside>
  <div id="chartwrap"><div id="tv"></div></div>
</main>
<script>
const PAIRS=[
  {n:'US100',d:'Nasdaq 100',s:'OANDA:NAS100USD'},
  {n:'US30',d:'Dow Jones 30',s:'OANDA:US30USD'},
  {n:'XAUUSD',d:'Gold / US Dollar',s:'OANDA:XAUUSD'},
  {n:'EURUSD',d:'Euro / US Dollar',s:'OANDA:EURUSD'},
  {n:'GBPUSD',d:'British Pound / US Dollar',s:'OANDA:GBPUSD'},
  {n:'AUDUSD',d:'Australian Dollar / US Dollar',s:'OANDA:AUDUSD'},
  {n:'USDJPY',d:'US Dollar / Japanese Yen',s:'OANDA:USDJPY'}
];
const $=id=>document.getElementById(id);
let S={n:'XAUUSD',theme:'dark'};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('s')||'{}'))}catch{}
const save=()=>{try{localStorage.setItem('s',JSON.stringify(S))}catch{}};

function list(){
  $('list').innerHTML=PAIRS.map(p=>`<button class="item ${p.n===S.n?'on':''}" data-n="${p.n}">${p.n}<small>${p.d}</small></button>`).join('');
}
function mount(){
  const p=PAIRS.find(x=>x.n===S.n)||PAIRS[0];
  $('tv').innerHTML='';
  new TradingView.widget({
    autosize:true,
    symbol:p.s,
    interval:'60',
    timezone:'Etc/UTC',
    theme:S.theme,
    style:'1',
    locale:'en',
    enable_publishing:false,
    allow_symbol_change:false,
    withdateranges:true,
    save_image:true,
    container_id:'tv'
  });
}
function apply(){
  document.documentElement.dataset.theme=S.theme;
  document.querySelector('meta[name=theme-color]').content=S.theme==='dark'?'#131722':'#ffffff';
  list();save();
}
$('list').onclick=e=>{const b=e.target.closest('.item');if(b){S.n=b.dataset.n;apply();mount()}};
$('theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';apply();mount()};
apply();mount();
</script>
</body>
</html>
