<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131722">
<title>نمودار بازار</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#131722;--panel:#1b2030;--line:#2a3042;--tx:#d1d4dc;--mut:#787b86;--up:#26a69a;--dn:#ef5350;--ac:#2962ff}
:root[data-theme=light]{--bg:#fff;--panel:#f4f5f8;--line:#e0e3eb;--tx:#131722;--mut:#6a6d78}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:13px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;white-space:nowrap}
button,select{background:transparent;color:var(--tx);border:1px solid transparent;border-radius:4px;padding:5px 9px;font:inherit;cursor:pointer}
button:hover,select:hover{background:var(--line)}
button.on{background:var(--ac);color:#fff}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
select{border-color:var(--line);background:var(--bg)}
.sep{width:1px;height:20px;background:var(--line);flex:none}
main{flex:1;display:flex;min-height:0}
#chartwrap{flex:1;position:relative;min-width:0;direction:ltr}
#chart{position:absolute;inset:0}
#legend{position:absolute;top:8px;left:10px;z-index:3;font-size:12px;pointer-events:none;direction:ltr;text-align:left;line-height:1.6}
#legend b{font-size:15px}
aside{width:210px;border-inline-start:1px solid var(--line);background:var(--panel);overflow-y:auto;flex:none}
aside h3{font-size:12px;color:var(--mut);padding:8px 10px;font-weight:600}
.row{display:flex;justify-content:space-between;padding:8px 10px;cursor:pointer;direction:ltr;border-bottom:1px solid var(--line)}
.row:hover{background:var(--line)}
.row.on{background:var(--line);box-shadow:inset 3px 0 var(--ac)}
.row .p{text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
#st{position:absolute;bottom:6px;left:10px;z-index:3;color:var(--mut);font-size:11px}
@media(max-width:700px){aside{display:none}#wl{display:inline-block!important}}
#wl{display:none}
body.side aside{display:block;position:absolute;inset:44px 0 0 auto;z-index:9;box-shadow:0 0 20px #0008}
</style>
</head>
<body>
<header>
  <select id="sym" aria-label="نماد"></select>
  <span class="sep"></span>
  <span id="tfs"></span>
  <span class="sep"></span>
  <button id="type">شمعی</button>
  <button id="ma20">MA20</button>
  <button id="ema50">EMA50</button>
  <button id="vol" class="on">حجم</button>
  <span class="sep"></span>
  <button id="theme">تم</button>
  <button id="wl">لیست</button>
</header>
<main>
  <div id="chartwrap"><div id="legend"></div><div id="chart"></div><div id="st"></div></div>
  <aside><h3>واچ‌لیست</h3><div id="list"></div></aside>
</main>
<script>
const SYMS=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT','AVAXUSDT'];
const TFS=['1m','5m','15m','1h','4h','1d','1w'];
const HOSTS=[['https://data-api.binance.vision','wss://data-stream.binance.vision'],['https://api.binance.com','wss://stream.binance.com:9443']];
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S=Object.assign({sym:'BTCUSDT',tf:'1h',type:'candle',ma:false,ema:false,vol:true,theme:'dark'},store.get('s',{}));
const save=()=>store.set('s',S);
let candles=[],main,volS,maS,emaS,ws,hostIdx=0,wsTimer;

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const chart=LightweightCharts.createChart($('chart'),{autoSize:true,crosshair:{mode:0},timeScale:{timeVisible:true,secondsVisible:false,borderVisible:false},rightPriceScale:{borderVisible:false}});

function themeChart(){
  chart.applyOptions({layout:{background:{color:css('--bg')},textColor:css('--mut')},grid:{vertLines:{color:css('--line')},horzLines:{color:css('--line')}}});
}
function build(){
  [main,volS,maS,emaS].forEach(s=>s&&chart.removeSeries(s));
  main=S.type==='candle'
    ?chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'})
    :chart.addAreaSeries({lineColor:'#2962ff',topColor:'#2962ff55',bottomColor:'#2962ff05',lineWidth:2});
  volS=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'v',visible:S.vol});
  chart.priceScale('v').applyOptions({scaleMargins:{top:.8,bottom:0}});
  maS=chart.addLineSeries({color:'#f5a623',lineWidth:1,visible:S.ma,priceLineVisible:false,lastValueVisible:false});
  emaS=chart.addLineSeries({color:'#b388ff',lineWidth:1,visible:S.ema,priceLineVisible:false,lastValueVisible:false});
  paint();
}
function sma(d,n){const o=[];let s=0;d.forEach((c,i)=>{s+=c.close;if(i>=n)s-=d[i-n].close;if(i>=n-1)o.push({time:c.time,value:s/n})});return o}
function ema(d,n){const k=2/(n+1),o=[];let e;d.forEach((c,i)=>{e=i?c.close*k+e*(1-k):c.close;if(i>=n-1)o.push({time:c.time,value:e})});return o}
function paint(){
  main.setData(S.type==='candle'?candles:candles.map(c=>({time:c.time,value:c.close})));
  volS.setData(candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'#26a69a66':'#ef535066'})));
  maS.setData(sma(candles,20));emaS.setData(ema(candles,50));
}
const fmt=v=>v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toPrecision(4);
function legend(c){
  if(!c)return;const up=c.close>=c.open,cl=up?'up':'dn';
  $('legend').innerHTML=`<b>${S.sym.replace('USDT','/USDT')}</b> · ${S.tf}<br><span class="${cl}">O ${fmt(c.open)} H ${fmt(c.high)} L ${fmt(c.low)} C ${fmt(c.close)}</span>`;
}
chart.subscribeCrosshairMove(p=>{
  const d=p.seriesData&&p.seriesData.get(main);
  if(d&&d.open!==undefined)legend(d);else if(!p.time)legend(candles[candles.length-1]);
});

async function load(){
  $('st').textContent='در حال دریافت…';
  for(let i=0;i<HOSTS.length;i++){
    const h=(hostIdx+i)%HOSTS.length;
    try{
      const r=await fetch(`${HOSTS[h][0]}/api/v3/klines?symbol=${S.sym}&interval=${S.tf}&limit=1000`);
      if(!r.ok)throw 0;
      const j=await r.json();
      hostIdx=h;
      candles=j.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
      paint();chart.timeScale().fitContent();legend(candles[candles.length-1]);
      $('st').textContent='';connect();return;
    }catch(e){}
  }
  $('st').textContent='خطا در دریافت داده. اتصال یا فیلترشکن را بررسی کنید.';
}
function connect(){
  clearTimeout(wsTimer);if(ws){ws.onclose=null;ws.close()}
  const sym=S.sym,tf=S.tf;
  ws=new WebSocket(`${HOSTS[hostIdx][1]}/ws/${sym.toLowerCase()}@kline_${tf}`);
  ws.onmessage=e=>{
    const k=JSON.parse(e.data).k;if(!k||sym!==S.sym||tf!==S.tf)return;
    const c={time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};
    const last=candles[candles.length-1];
    if(last&&last.time===c.time)candles[candles.length-1]=c;else candles.push(c);
    main.update(S.type==='candle'?c:{time:c.time,value:c.close});
    volS.update({time:c.time,value:c.volume,color:c.close>=c.open?'#26a69a66':'#ef535066'});
    const m=sma(candles.slice(-20),20),n=ema(candles,50);
    if(m.length)maS.update(m[m.length-1]);if(n.length)emaS.update(n[n.length-1]);
    legend(c);
  };
  ws.onclose=()=>{wsTimer=setTimeout(connect,3000)};
}
async function watch(){
  try{
    const r=await fetch(`${HOSTS[hostIdx][0]}/api/v3/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(SYMS))}`);
    const j=await r.json();
    $('list').innerHTML=j.map(t=>{const ch=+t.priceChangePercent;return`<div class="row ${t.symbol===S.sym?'on':''}" data-s="${t.symbol}"><span>${t.symbol.replace('USDT','')}</span><span class="p">${fmt(+t.lastPrice)}<br><small class="${ch>=0?'up':'dn'}">${ch>=0?'+':''}${ch.toFixed(2)}%</small></span></div>`}).join('');
  }catch{}
}
$('list').onclick=e=>{const r=e.target.closest('.row');if(r){S.sym=r.dataset.s;$('sym').value=S.sym;document.body.classList.remove('side');sync();load();watch()}};

SYMS.forEach(s=>$('sym').add(new Option(s.replace('USDT','/USDT'),s)));
$('sym').onchange=e=>{S.sym=e.target.value;sync();load();watch()};
TFS.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.dataset.t=t;$('tfs').append(b)});
$('tfs').onclick=e=>{const t=e.target.dataset.t;if(t){S.tf=t;sync();load()}};
$('type').onclick=()=>{S.type=S.type==='candle'?'area':'candle';sync();build()};
$('ma20').onclick=()=>{S.ma=!S.ma;maS.applyOptions({visible:S.ma});sync()};
$('ema50').onclick=()=>{S.ema=!S.ema;emaS.applyOptions({visible:S.ema});sync()};
$('vol').onclick=()=>{S.vol=!S.vol;volS.applyOptions({visible:S.vol});sync()};
$('theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';sync();themeChart()};
$('wl').onclick=()=>document.body.classList.toggle('side');
function sync(){
  document.documentElement.dataset.theme=S.theme;
  $('type').textContent=S.type==='candle'?'شمعی':'خطی';
  $('type').title='تغییر نوع نمودار';
  $('ma20').classList.toggle('on',S.ma);$('ema50').classList.toggle('on',S.ema);$('vol').classList.toggle('on',S.vol);
  [...$('tfs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===S.tf));
  $('sym').value=S.sym;save();
}
sync();themeChart();build();load();watch();setInterval(watch,10000);
</script>
</body>
</html>
